apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: purchasing
  description: This is a system for manageing user purchases
spec:
  owner: ecommerce

---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: shopping-cart
spec:
  dependsOn:
    - "component:inventory"
  type: website
  lifecycle: production
  owner: user:chris
  system: purchasing

---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inventory
spec:
  type: service
  lifecycle: production
  owner: ecommerce
  system: purchasing

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: ecommerce
spec:
  type: team
  children: []

---

apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: chris
spec:
  memberOf: [ecommerce]